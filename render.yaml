# Free permanent hosting note:
# Deploy backend/ as the FastAPI service.
# Deploy website/ (Next.js) and panel/ (React) as separate frontends.

services:
  - type: web
    name: edunest-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./school_saas.db
      - key: UPLOAD_DIR
        value: uploads
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:5173,*

# Permanent free hosting on Render (auto-deploy on push to main).
# One-click: https://dashboard.render.com/blueprint/new?repo=https://github.com/vinodbairwa/school_college_manage

services:
  - type: web
    name: edunest-api
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/vinodbairwa/school_college_manage
    rootDir: backend
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./school_saas.db
      - key: UPLOAD_DIR
        value: uploads
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://edunest-api.onrender.com,http://localhost:3000,http://localhost:5173
      - key: WEBSITE_URL
        value: https://edunest-api.onrender.com
      - key: PANEL_URL
        value: https://edunest-api.onrender.com

name: Deploy reminder

# Render auto-deploys from Git when the Blueprint is connected.
# This workflow only verifies the app imports cleanly on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Import app
        run: |
          cp .env.example .env
          python -c "from app.main import app; print(app.title)"
      - name: Seed + health (local)
        run: |
          python seed.py
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 2
          curl -sf http://127.0.0.1:8000/health

name: Render deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - render.yaml
      - backend/**
      - .github/workflows/render-deploy.yml

jobs:
  trigger:
    if: ${{ secrets.RENDER_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync Render Blueprint
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -sf -X POST "https://api.render.com/v1/blueprints" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"name":"edunest","repo":"https://github.com/vinodbairwa/school_college_manage","branch":"main","autoDeploy":"yes"}'
